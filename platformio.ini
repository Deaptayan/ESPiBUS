; PlatformIO project config
; Build for the S3:      pio run -e esp32s3 -t upload
; Build for the C3:      pio run -e esp32c3 -t upload
; Build for DevKit V1:   pio run -e esp32dev -t upload
;
; BOARD_HAS_DUAL_CORE is the switch the rest of the code branches on
; (tasks.cpp). It is NOT auto-detected from the chip - it's set explicitly
; here per environment, which keeps the intent obvious and lets you force
; single-core behavior on a dual-core chip if you ever want to.

[platformio]
default_envs = esp32s3

[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=1

; ---------------- ESP32-S3 : dual core ----------------
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D BOARD_HAS_DUAL_CORE=1

; ---------------- ESP32 DevKit V1 (WROOM-32) : dual core ----------------
[env:esp32dev]
platform = espressif32
board = esp32dev
build_flags =
    ${env.build_flags}
    -D BOARD_HAS_DUAL_CORE=1

; ---------------- ESP32-C3 : single core RISC-V ----------------
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
board_build.usb_mode = cdc
build_flags =
    ${env.build_flags}
    -D BOARD_HAS_DUAL_CORE=0
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
